apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
data:
  # 라우트 대상은 k8s Service DNS. (Spring relaxed binding: ROUTES_AUTH -> routes.auth)
  ROUTES_AUTH: "http://auth-service:8080"
  ROUTES_MEMBER: "http://member-service:8080"
  ROUTES_PRODUCT: "http://product-service:8080"
  # 게이트웨이 JWT 검증용 JWKS (auth-service Service DNS)
  JWK_SET_URI: "http://auth-service:8080/oauth2/jwks"

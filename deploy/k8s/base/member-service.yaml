apiVersion: v1
kind: ConfigMap
metadata:
  name: member-service-config
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/member"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  # 토큰 검증용 JWKS — auth-service의 Service DNS
  JWK_SET_URI: "http://auth-service:8080/oauth2/jwks"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-service
  labels:
    app: member-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: member-service
  template:
    metadata:
      labels:
        app: member-service
    spec:
      containers:
        - name: member-service
          image: ecommerce/member-service:latest
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: member-service-config
            - secretRef:
                name: db-credentials
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: member-service
spec:
  selector:
    app: member-service
  ports:
    - name: http
      port: 8080
      targetPort: 8082

server:
  port: 8080

spring:
  application:
    name: api-gateway

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness, /readiness (k8s probe용)
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
